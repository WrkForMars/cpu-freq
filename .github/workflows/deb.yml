name: Paquete .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para adjuntar el .deb a la versión cuando se sube una etiqueta v*

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev librsvg2-bin dpkg-dev

      - name: Compilar (sin advertencias) y empaquetar
        run: make deb

      - name: Revisar el paquete
        run: |
          dpkg-deb --info build/*.deb
          dpkg-deb --contents build/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-freq-deb
          path: build/*.deb

      - name: Publicar en la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
