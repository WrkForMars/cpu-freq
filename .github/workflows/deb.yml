name: Build .deb

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to attach the .deb files to the release when a v* tag is pushed

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev \
            libxfce4panel-2.0-dev librsvg2-bin gettext dpkg-dev

      - name: Build (no warnings) and package
        run: make deb

      - name: Inspect the packages
        run: |
          for d in build/*.deb; do dpkg-deb --info "$d"; dpkg-deb --contents "$d"; done

      - uses: actions/upload-artifact@v4
        with:
          name: cpu-freq-deb
          path: build/*.deb

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
